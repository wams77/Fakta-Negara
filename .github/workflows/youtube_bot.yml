name: Generate YouTube Shorts Bot

on:
  schedule:
    - cron: '0 22,4,10 * * *'
  workflow_dispatch:

# TAMBAHAN BARU: Memberikan izin bot untuk menulis file (commit) ke repo Anda
permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        
    - name: Fix ImageMagick Policy
      run: |
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        python bot.py
        
    # TAMBAHAN BARU: Menyimpan history.txt kembali ke GitHub
    - name: Commit and Push History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Mencek apakah ada file history.txt yang berubah/dibuat
        git add history.txt
        # Commit file tersebut, atau abaikan jika tidak ada perubahan (misal karena bot error/gagal upload)
        git commit -m "Update riwayat negara [skip ci]" || echo "Tidak ada perubahan riwayat"
        git push

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: youtube-shorts-video
        path: hasil_shorts.mp4
        retention-days: 7
