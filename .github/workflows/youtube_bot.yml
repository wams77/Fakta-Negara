name: Generate YouTube Shorts Bot

on:
  schedule:
    # Berjalan setiap hari pada jam 08:00 UTC (15:00 WIB/ 16:00 WITA)
    - cron: '0 8 * * *'
  workflow_dispatch: # Mengizinkan Anda menekan tombol "Run workflow" secara manual

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        
    - name: Fix ImageMagick Policy for MoviePy
      # ImageMagick di Ubuntu membatasi rendering teks, ini untuk membukanya
      run: |
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        python bot.py
        
    - name: Upload Artifact (Opsional: Agar bisa didownload dari GitHub)
      uses: actions/upload-artifact@v3
      with:
        name: youtube-shorts-video
        path: hasil_shorts.mp4
