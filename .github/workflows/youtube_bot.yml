name: Generate YouTube Shorts Bot

on:
  schedule:
    # Berjalan setiap hari pada jam 08:00 UTC (15:00 WIB / 16:00 WITA)
    - cron: '0 8 * * *'
  workflow_dispatch: # Mengizinkan Anda menekan tombol "Run workflow" secara manual untuk pengujian

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        
    - name: Fix ImageMagick Policy for MoviePy
      # ImageMagick di Ubuntu secara default membatasi rendering teks karena alasan keamanan.
      # Perintah ini membuka akses read/write agar MoviePy bisa membuat teks subtitle/judul.
      run: |
        sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    - name: Run Bot Script
      # Memanggil semua Secrets yang sudah disimpan di pengaturan GitHub
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        python bot.py
        
    - name: Upload Artifact (Opsional)
      uses: actions/upload-artifact@v4
      # Langkah ini menyimpan hasil video di GitHub agar Anda bisa mendownloadnya
      # secara manual jika terjadi gagal upload ke YouTube
      with:
        name: youtube-shorts-video
        path: hasil_shorts.mp4
        retention-days: 7 # Menghapus video dari server GitHub setelah 7 hari untuk menghemat ruang
